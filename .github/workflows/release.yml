name: Релиз

# Выпуск собирается сам, когда в main попадает новая версия: номер лежит в version.json ({"line": "1.2", "update": 24} → v1.2.24).
# Если выпуск с таким номером уже есть, ничего не происходит. Заново собрать вручную: Actions → «Релиз» → Run workflow (галочка «Пересобрать»).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'build.py'
      - 'version.json'
      - 'release-notes.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Пересобрать, даже если выпуск с этим номером уже есть'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Какой номер выпускаем
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          VERSION=$(python3 -c "import json; v=json.load(open('version.json')); print(v['line']+'.'+str(v['update']))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ] || ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Собираем v$VERSION"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "Выпуск v$VERSION уже есть — пропускаем"
          fi

  page:
    name: Страница и файл обновления
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Собрать страницу
        env: { PYTHONUTF8: '1' }
        run: |
          python build.py
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: |
            dist/vnmap-update-*.zip
            dist/vnmap.html

  shell:
    name: Оболочка (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Собрать страницу для оболочки
        env: { PYTHONUTF8: '1' }
        run: python build.py
      - name: Ключ Google (необязательно)
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then printf '%s' "$GOOGLE_OAUTH_JSON" > desktop/google-oauth.json; echo "ключ Google вложен"; else echo "ключа Google нет: каждый вводит свой в настройках"; fi
      - name: Установщики
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          case "${{ matrix.os }}" in
            windows-latest) npx electron-builder --win --x64 --publish never ;;
            ubuntu-latest)  npx electron-builder --linux --x64 --publish never ;;
            macos-latest)   npx electron-builder --mac --x64 --arm64 --publish never ;;
          esac
          ls -la release
      - name: Проверка пакета (все файлы оболочки внутри app.asar)
        working-directory: desktop
        shell: bash
        run: node tools/checkpkg.js release
      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg
            desktop/release/*.zip

  publish:
    name: Выпуск на GitHub
    needs: [plan, page, shell]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.page.result == 'success' }}   # выпуск делается, даже если одна из систем не собралась
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Создать или обновить выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          TAG="v$VERSION"
          ls -la out
          NOTES=release-notes.md; [ -f "$NOTES" ] || echo "Версия $VERSION" > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # старые файлы обновления убираем: в выпуске должен остаться один vnmap-update-….zip
            for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^vnmap-update' || true); do
              gh release delete-asset "$TAG" "$a" --yes --repo "$GITHUB_REPOSITORY"
            done
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Карта новеллы $VERSION" --notes-file "$NOTES" --latest
          fi
